  - id: desktop.runtime-theme-relaunch
    title: Preserve late-bound runtime theme selections across relaunch
    owner: kosta
    owner_paths:
      - apps/desktop/src/themes/context.tsx
      - apps/desktop/src/themes/profile-theme.test.ts
    collision_paths:
      - apps/desktop/src/themes/context.tsx
    tests:
      - apps/desktop/src/themes/profile-theme.test.ts
    checks:
