schema_version: 2
version: 1
upstream_ref: origin/main
legacy_provisional_until: 2026-10-01
exemptions_file: scripts/local_carry_exemptions.yaml
managed_roots:
  - agent
  - apps/desktop
  - cli.py
  - gateway
  - hermes_cli
  - hermes_state.py
  - plugins
  - run_agent.py
  - scripts
  - tools
  - web

checks:
  - id: prompt-dedupe-completion-blocks
    path: agent/prompt_builder.py
    needles: ["# Tool-use enforcement", "# Finishing the job", "# Execution discipline"]
    description: 2026-08-08 injection-dedupe — TASK_COMPLETION_GUIDANCE is the sole owner of keep-working/verify prose; TOOL_USE_ENFORCEMENT (act-now) and OPENAI_MODEL_EXECUTION_GUIDANCE (tool persistence) were trimmed of duplicate completion sentences. If an upstream merge restores them, re-trim.
  - id: dashboard-host-allowlist
    path: hermes_cli/web_server.py
    needles: [register_instance, allowed_hosts, _configured_dashboard_allowed_hosts]
    description: dashboard callback and host allowlist
  - id: provider-usage-mount
    path: web/src/App.tsx
    needles: []
    description: RETIRED 2026-07-29 — dashboard plugin discovery now owns the provider usage tab.
  - id: subscription-usage-client
    path: web/src/lib/api.ts
    needles: []
    description: RETIRED 2026-07-29 — plugin UI uses the authenticated SDK fetch helper and namespaced backend.
  - id: bluebubbles-plugin-registry-hook
    path: tools/send_message_tool.py
    needles: ["platform_registry.get(\"bluebubbles\")"]
    description: BlueBubbles plugin registry hook (adapter carry retired to hermes-kosta-plugins 2026-07-23)
  - id: vibeproxy-alias-priority
    path: hermes_cli/models.py
    needles: [POSITION IS LOAD-BEARING, "\"vibeproxy\": ["]
    description: vibeproxy dict position ahead of anthropic drives bare-alias routing to the local proxy; do not reorder or enroll in _BORROWED_MODEL_PROVIDERS (refuted 2026-07-23)
  - id: vibeproxy-alias-guard-tests
    path: tests/test_vibeproxy_alias_priority.py
    needles: [test_startup_runtime_resolves_short_alias_without_network, test_startup_runtime_does_not_call_network_detector]
    description: guard tests for vibeproxy short-alias default routing
  - id: vibeproxy-credential-plumbing
    path: hermes_cli/auth.py
    needles: [DEFAULT_VIBEPROXY_BASE_URL, VIBEPROXY_NOAUTH_PLACEHOLDER]
    description: vibeproxy no-auth credential registry entry and ambient-discovery exclusion
  - id: vibeproxy-runtime-dispatch
    path: hermes_cli/runtime_provider.py
    needles: [DEFAULT_VIBEPROXY_BASE_URL]
    description: vibeproxy chat_completions api-mode and base_url defaulting
  - id: vibeproxy-transport-seams
    path: agent/transports/chat_completions.py
    needles: [_is_vibeproxy_claude_family, _normalize_mcp_wire_tool_name, finalize_api_kwargs]
    description: vibeproxy reasoning fallback, mcp__ wire-name reverse cloak (pairs with the vibeproxy-provider plugin's outbound cloak), and the finalize_api_kwargs profile seam the plugin depends on
  - id: bundled-image-skill-host-neutral-baoyu-article
    path: optional-skills/creative/baoyu-article-illustrator/SKILL.md
    needles: [Verify the host before generating., 127.0.0.1 resolves to whatever machine the client runs on]
    description: bundled image-generation skill stays host-neutral (upstream-PR candidate)
  - id: bundled-image-skill-host-neutral-baoyu-comic
    path: optional-skills/creative/baoyu-comic/SKILL.md
    needles: [Verify the host before generating., 127.0.0.1 resolves to whatever machine the client runs on]
    description: bundled image-generation skill stays host-neutral (upstream-PR candidate)
  - id: bundled-image-skill-host-neutral-pixel-art
    path: optional-skills/creative/pixel-art/SKILL.md
    needles: [Verify the host before generating., "~/.hermes/skills/creative/pixel-art/scripts"]
    description: bundled pixel-art skill stays host-neutral (upstream-PR candidate)
  - id: bundled-image-skill-host-neutral-stable-diffusion
    path: optional-skills/mlops/stable-diffusion/SKILL.md
    needles: [Verify the host before generating., 127.0.0.1 resolves to whatever machine the client runs on]
    description: bundled image-generation skill stays host-neutral (upstream-PR candidate)
  - id: bundled-image-skill-host-neutral-infographic
    path: skills/creative/baoyu-infographic/SKILL.md
    needles: [Verify the host before generating., 127.0.0.1 resolves to whatever machine the client runs on]
    description: bundled image-generation skill stays host-neutral (upstream-PR candidate)
  - id: bundled-image-skill-host-neutral-comfyui
    path: skills/creative/comfyui/SKILL.md
    needles: [Verify the host before generating., 127.0.0.1 resolves to whatever machine the client runs on]
    description: bundled image-generation skill stays host-neutral (upstream-PR candidate)

  - id: provider-profile-finalize-hook
    path: providers/base.py
    needles: [finalize_api_kwargs]
    description: finalize_api_kwargs ProviderProfile hook (vibeproxy plugin seam; upstream-PR candidate)
  - id: closed-session-mcp-refresh
    path: tools/mcp_tool.py
    needles: [session is None, skipping dynamic tool refresh; session is closed]
    description: closed-session MCP refresh guard
  - id: legacy-trigram-config
    path: hermes_state.py
    needles: [_fts_trigram_disabled, disable_fts_trigram]
    description: preserve the config-backed legacy trigram flag after the upstream state-schema split; the retired denormalized session-recents index is replaced by the upstream recursive last-active query
  - id: bounded-session-read-connections
    path: hermes_state.py
    needles: [_read_conns_lock, locked writer connection]
    description: preserve the bounded SQLite reader strategy and locked-writer fallback across the local per-thread implementation and the upstream pooled-reader replacement so dashboard/profile fan-out cannot exhaust process file descriptors
  - id: auth-store-io-classification
    path: hermes_cli/auth.py
    needles: [File-system/resource failures, json.JSONDecodeError, UnicodeDecodeError]
    description: quarantine only malformed auth JSON; propagate permission, EMFILE, and storage I/O failures truthfully
  - id: parallel-sdk-availability-probe
    path: plugins/web/parallel/provider.py
    needles: [import parallel, availability probe]
    description: avoid invoking disabled lazy installation when the Parallel SDK is already importable, including test-provided modules
  - id: detached-restart-cli
    path: cli.py
    needles: [restart-gateways, enqueue_detached_restart]
    description: CLI detached restart dispatch
  - id: detached-restart-command-registry
    path: hermes_cli/commands.py
    needles: [restart-webui, restart-gateways, restart-hermes]
    description: expose detached restart commands and aliases through the shared command registry
  - id: gateway-compact-voice
    path: gateway/run.py
    needles: [_handle_detached_surface_restart_command, __compact__, compact_tool_counts, _update_compact_tool_progress, register_live_voice_streamer]
    description: gateway restart, compact HUD, and Discord live voice integration
  - id: gateway-turn-context-carry
    path: gateway/turn_context.py
    needles: [compact_tool_counts, compact_todo_args, voice_reply_consumer_holder, live_voice_guild]
    description: carry state cells used by compact progress and Discord live voice after the upstream TurnRunner extraction
  - id: discord-live-voice
    path: plugins/platforms/discord/adapter.py
    needles: []
    description: RETIRED 2026-07-23 — Discord live voice/barge-in/busy-audio carry moved to hermes-kosta-plugins discord_override; core file reverted to pristine upstream. Entry removable once the path drops out of changed_paths.
  - id: spoken-text-formatting
    path: hermes_cli/web_server.py
    needles: []
    description: RETIRED 2026-07-29 — upstream shared TTS normalization now owns deterministic spoken-text cleanup; the slim-only model rewrite layer and duplicate formatter were removed.
  - id: desktop-read-aloud-autoplay
    path: apps/desktop/electron/main.ts
    needles: [autoplay-policy, no-user-gesture-required]
    description: asynchronous Desktop read-aloud playback
  - id: restart-readiness
    path: hermes_cli/restart_surfaces.py
    needles: [_resolve_loaded_service, restarted_services, _wait_for_scope_health]
    description: launchd domain dedupe and readiness polling
  - id: dashboard-restart-health-contract
    path: hermes_cli/web_server.py
    needles: ['@app.get("/health")', 'async def get_api_health', active_turn_snapshot, hermes-dashboard-ok]
    description: public marker-bearing health stays distinct from the existing Desktop API health endpoint
  - id: desktop-active-turn-snapshot
    path: tui_gateway/server.py
    needles: [active_turn_snapshot, oldest_run_age_seconds, inflight_turn]
    description: restart probes can drain in-memory Desktop/TUI turns without filesystem or process probes
  - id: gateway-identity-restamp
    path: gateway/shutdown_watchdog.py
    needles: [_refresh_runtime_status_identity]
    description: heartbeat loop re-stamps runtime-status identity so foreign clobbers self-heal
  - id: gateway-active-work-writer
    path: gateway/run.py
    needles: [persist_active_agents_now, _active_agents_persist_lock, 'extra_provider=lambda:', 'active_agents=self._active_work_count', 'A failed count is unknown, never idle']
    description: update-safe restart drain publishes live work at turn boundaries and in the independent loop heartbeat
  - id: gateway-active-work-status-stamp
    path: gateway/status.py
    needles: [_process_owns_runtime_status, _RUNTIME_STATUS_WRITE_LOCK, _runtime_status_file_lock, active_agents_updated_at, 'if callable(active_agents)']
    description: active-work count writes are serialized, re-snapshotted, and independently freshness-stamped
  - id: gateway-active-work-api-claims
    path: gateway/platforms/api_server.py
    needles: [_persist_active_agents_for_api, persist_active_agents_now]
    description: API admission and detached-run claims remain visible to safe restart drains
  - id: gateway-active-work-cron-claims
    path: cron/scheduler.py
    needles: [_persist_active_agents_for_cron, persist_active_agents_now]
    description: cron dispatch and release remain visible to safe restart drains
  - id: cron-memory-provider-tools-only-routing
    path: cron/scheduler.py
    needles: [_cron_job_needs_memory_provider, memory_provider_tools_only]
    description: explicitly authorized memory-maintenance jobs receive provider tools without passive cron memory
  - id: memory-provider-tools-only-isolation
    path: agent/memory_manager.py
    needles: [tools_only, self._tools_only]
    description: tools-only provider managers suppress recall and automatic capture while retaining explicit provider tool routing
  - id: daemon-thread-pool-python-compatibility
    path: tools/daemon_pool.py
    needles: [_create_worker_context, worker_args]
    description: daemon executor supports both legacy initializer args and Python 3.14 worker contexts
  - id: external-profile-cron-status-contract
    path: hermes_cli/cron.py
    needles: [_external_profile_ticker_state, ticker_external.json]
    description: cron status recognizes the cadence and health evidence of the profile LaunchAgent ticker
  - id: restart-first-upgrade-idle-bridge
    path: hermes_cli/restart_surfaces.py
    needles: [_old_writer_requires_graceful_transition, owner-controlled graceful drain]
    description: the post-update helper transitions an old writer through its internal drain without inferring idle from stale telemetry
  - id: desktop-build-hooks
    path: apps/desktop/package.json
    needles: ['"afterPack"', '"entitlements"']
    description: Desktop lifecycle hook declarations
  - id: unattended-signing
    path: apps/desktop/scripts/after-pack.mjs
    needles: [3A22F53A48A189F4A8766CACE00192860CC37F8F, HERMES_OP_SHIM, HERMES_SIGNING_PASSWORD_SERVICE, serviceAccountToken, set-key-partition-list, 'apple-tool:,apple:,codesign:', refusing to produce an ad-hoc local build]
    description: unattended Developer ID signing
  - id: forced-compaction-tail-budget
    path: agent/context_compressor.py
    needles: [_tail_budget_for_compression]
    description: manual /compress tail budget scaled from observed usage (replaces retired compaction-replay-budget entry — replay budget is upstream since 65d42e35; upstream-PR candidate)
  - id: portable-guest-denylist
    path: gateway/guest_access.py
    needles: [_HOST_HOME_PATH, _HOST_HOME_PATH_RE, Path.home()]
    description: portable guest host-home denylist
  - id: local-desktop-copy
    path: apps/desktop/src/i18n/local-carry.ts
    needles: [draftPendingNotice]
    description: draft pending notice outside hot locale literals
  - id: shared-rerere-cache
    path: scripts/setup_local_merge_aids.sh
    needles: [rerere.autoupdate, git-rr-cache]
    description: shareable rerere setup helper

features:
  - id: update.futureproof-system
    title: Recoverable, resource-bounded slim update system
    owner: kosta
    class: keep-core
    owner_paths:
      - apps/desktop/README.md  # local signing doc note (CSC_NAME hazard), formerly owned by browser-workspace
      - apps/desktop/vitest.config.ts
      - hermes_cli/memory_setup.py
      - hermes_cli/update_cmd.py
      - scripts/hermes_checkpoint.py
      - scripts/carry.py
      - scripts/carry_gate.py
      - scripts/hermes_update_service.py
      - scripts/local_carry_manifest.yaml
      - scripts/setup_update_service.py
      - scripts/setup_futureproof_hooks.sh
      - scripts/thinning.py
      - scripts/thinning_baseline.json
      - scripts/verify_deployed_turn.py
      - tools/lazy_deps.py
      - scripts/local_carry_exemptions.yaml
      - scripts/run_tests.sh
      - scripts/run_tests_parallel.py
      - scripts/run_update_smart_client_validation.sh
    collision_paths:
      - scripts/run_tests.sh
      - scripts/run_tests_parallel.py
      - scripts/run_update_smart_client_validation.sh
    consumer:
      command:
        - python3
        - scripts/hermes_update_service.py
        - --help
    runtime_probe:
      command:
        - python3
        - scripts/setup_update_service.py
        - check
    tests:
      - tests/scripts/test_hermes_checkpoint.py
      - tests/scripts/test_carry_v2.py
      - tests/scripts/test_hermes_update_service.py
      - tests/scripts/test_setup_update_service.py
    checks:
      - id: futureproof-safe-checkpoint
        path: scripts/hermes_checkpoint.py
        needles: [refs/hermes/checkpoints, GIT_INDEX_FILE, PARTIAL, restore]
        description: checkpoint refs preserve WIP without advancing the live branch
      - id: futureproof-carry-registry
        path: scripts/carry.py
        needles: [changed-since, managed_roots, runtime_probe, consume-override, needle_relocations]
        description: deterministic ownership and connected-behavior gate
      - id: futureproof-exact-tree-gate
        path: scripts/carry_gate.py
        needles: [isolated_tree, --cached, local_sha, remote_sha]
        description: hooks validate the exact staged and pushed trees
      - id: futureproof-update-service
        path: scripts/hermes_update_service.py
        needles: [PREPARED, COMPLETED, start_new_session, FD_LIMIT, nonce_valid, preflight_assessment, FAST_PATH_TARGET_SECONDS, remove_rehearsal_worktree]
        description: detached update supervision and receipted deployment
      - id: futureproof-notarization
        path: scripts/setup_update_service.py
        needles: [APPLE_NOTARY_PROFILE, my-notary-profile]
        description: updater builds use the validated local notarytool profile
      - id: futureproof-collision-ratchet
        path: scripts/thinning.py
        needles: [weighted_score, upstream_churn, Thinning ratchet]
        description: forward-only collision density ratchet

  - id: security.approval-contract-isolation
    title: Approval prompt contract isolation and safe verifier cleanup
    owner: kosta
    class: keep-core
    owner_paths:
      - tools/approval.py
      - tests/tools/test_command_guards.py
    collision_paths:
      - tools/approval.py
      - tests/tools/test_command_guards.py
    tests:
      - tests/tools/test_command_guards.py
      - tests/tools/test_approval.py
    checks:
      - id: approval-manual-contract-fixture
        path: tests/tools/test_command_guards.py
        needles: [_get_approval_mode, manual]
        description: command-guard prompt tests are isolated from the configured smart approval mode
      - id: approval-verifier-temp-alias
        path: tools/approval.py
        needles: [raw_temp_dir, canonical_operand, raw_operand]
        description: verifier cleanup accepts the canonical macOS /tmp alias without permitting nested aliases

  - id: webui.session-defaults
    title: WebUI session visibility, labels, and uncapped pins
    tests:
      - web/src/lib/api.test.ts
      - web/src/lib/internal-agent-input.test.ts
      - web/src/components/ProfileSwitcher.test.ts
      - tests/hermes_cli/test_web_server_session_search.py
    checks:
      - id: desktop-uncapped-pinned-sessions
        path: apps/desktop/src/app/chat/sidebar/index.tsx
        needles: ['contentClassName="flex flex-col gap-px rounded-lg pb-2 pt-1"']
        forbidden_needles: ['flex max-h-44 flex-col gap-px rounded-lg pb-2 pt-1']
        description: pinned sessions use the outer sidebar scroll without a three-row cap
      - id: webui-hidden-session-sources
        path: web/src/lib/api.ts
        needles:
          - WEBUI_HIDDEN_MESSAGING_SESSION_SOURCES
          - withDefaultSessionExclusions
          - appendSessionFilters
        description: browser recents and search exclude messaging transcripts
      - id: webui-search-source-filter
        path: hermes_cli/web_routers/sessions.py
        needles: ['@search_router.get("/api/sessions/search")', 'excluded_sources = {', 'source_hidden(payload.get("source"))']
        description: session search enforces source exclusions in the backend
      - id: webui-internal-agent-input
        path: web/src/lib/internal-agent-input.ts
        needles: [isBackgroundProcessAgentInput, isAsyncDelegationAgentInput, isInternalAgentInput]
        description: synthetic process and delegation prompts are not used as session titles
      - id: webui-internal-agent-input-consumer
        path: web/src/components/ChatSessionList.tsx
        needles: ['import { isInternalAgentInput }', 'preview && !isInternalAgentInput(preview)']
        description: session labels actually apply synthetic-title suppression
      - id: webui-profile-label-helper
        path: web/src/lib/profile-label.ts
        needles: [formatProfileLabel, '.split("-")']
        description: profile IDs retain stable values while labels are title-cased
      - id: webui-profile-label-mount
        path: web/src/components/ProfileSwitcher.tsx
        needles: [formatProfileLabel]
        description: profile switcher renders labels through the formatting helper

  - id: desktop.chat-layout
    title: Responsive chat width modes
    owner_paths:
      - apps/desktop/src/store/chat-width.ts
      - apps/desktop/src/main.tsx
    dependent_paths:
      - apps/desktop/src/app/settings/appearance-settings.tsx
    collision_paths:
      - apps/desktop/src/app/settings/appearance-settings.tsx
    tests:
      - apps/desktop/src/store/chat-width.test.ts
    checks:
      - id: desktop-chat-width-store
        path: apps/desktop/src/store/chat-width.ts
        needles: [hermes.desktop.chatWidth.v1, 48.75rem, 68rem, "100%"]
        description: persisted Normal, Wide, and Full chat widths
      - id: desktop-chat-width-bootstrap
        path: apps/desktop/src/main.tsx
        needles: [./store/chat-width]
        description: pre-render chat width application
      - id: desktop-chat-width-settings
        path: apps/desktop/src/app/settings/appearance-settings.tsx
        needles: [setChatWidth, chatWidthOptions]
        description: chat width settings control

  - id: desktop.markdown-table-layout
    title: Fit and horizontally scrollable Markdown tables
    owner_paths:
      - apps/desktop/src/store/table-layout.ts
      - apps/desktop/src/styles.css
    dependent_paths:
      - apps/desktop/src/app/settings/appearance-settings.tsx
    collision_paths:
      - apps/desktop/src/app/settings/appearance-settings.tsx
    tests:
      - apps/desktop/src/store/table-layout.test.ts
    checks:
      - id: desktop-table-layout-store
        path: apps/desktop/src/store/table-layout.ts
        needles: [hermes.desktop.tableLayout.v1, hermesTableLayout]
        description: persisted Fit and Scroll table modes
      - id: desktop-table-layout-styles
        path: apps/desktop/src/styles.css
        needles: [data-hermes-table-layout, 'width: max-content', 'min-width: 6rem', 'max-width: 24rem']
        description: bounded cells and transcript-contained horizontal scrolling
      - id: desktop-table-layout-settings
        path: apps/desktop/src/app/settings/appearance-settings.tsx
        needles: [setTableLayout, tableLayoutOptions]
        description: Markdown table settings control

  - id: desktop.local-enhancements-settings
    title: Local enhancements settings section
    owner_paths:
      - apps/desktop/src/app/settings/local-enhancements-section.tsx
      - apps/desktop/src/i18n/local-carry.ts
    dependent_paths:
      - apps/desktop/src/app/settings/appearance-settings.tsx
    collision_paths:
      - apps/desktop/src/app/settings/appearance-settings.tsx
    tests:
      - apps/desktop/src/app/settings/local-enhancements-section.test.tsx
    checks:
      - id: desktop-local-enhancements-component
        path: apps/desktop/src/app/settings/local-enhancements-section.tsx
        needles: [desktop.local-enhancements-settings, LocalEnhancementsSection]
        description: reusable collapsible local-enhancements chrome
      - id: desktop-local-enhancements-mount
        path: apps/desktop/src/app/settings/appearance-settings.tsx
        needles: [LocalEnhancementsSection]
        description: Appearance local-enhancements section mount
      - id: desktop-local-enhancements-copy
        path: apps/desktop/src/i18n/local-carry.ts
        needles: [localCarrySettings, Local Enhancements]
        description: isolated localized local-carry copy

  - id: desktop.loopback-url-fences
    title: Preserve fenced loopback API endpoints
    tests:
      - apps/desktop/src/components/assistant-ui/markdown-text.test.ts
    checks:
      - id: desktop-loopback-url-fence-preprocess
        path: apps/desktop/src/lib/markdown-preprocess.ts
        needles: [LOOPBACK_URL_RE, normalizeVisibleProse]
        description: prevents local preview cleanup from erasing explicit fenced localhost endpoints

  - id: skills.generated-view-alias-resolution
    title: Resolve generated-view skills without treating support files as standalone skills
    owner_paths:
      - agent/skill_utils.py
      - tools/skills_tool.py
    tests:
      - tests/agent/test_skill_utils.py
      - tests/tools/test_skills_tool.py
    checks:
      - id: generated-view-skill-support-dirs
        path: agent/skill_utils.py
        needles:
          - '"reference"'
          - '"references"'
          - is_skill_support_path
        description: singular and plural support directories stay outside active skill discovery
      - id: generated-view-skill-alias-resolver
        path: tools/skills_tool.py
        needles:
          - Generated Hermes views flatten categorized paths
          - separator_offsets
          - categorized_alias
          - '"name": resolved_name'
