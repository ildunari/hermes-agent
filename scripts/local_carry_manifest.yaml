      - apps/desktop/src/app/chat/composer/model-pill.test.tsx
      - apps/desktop/src/app/chat/composer/model-pill.tsx
      - apps/desktop/src/app/session/hooks/use-message-stream/index.ts
      - apps/desktop/src/app/session/hooks/use-message-stream/session-info-side-effects.test.tsx
