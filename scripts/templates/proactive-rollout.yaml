agent:
  proactive:
    enabled: true
    mode: observe
    transport_owner_profile: poke
    # Installer creates this exact cron target and live remains closed until a
    # recent probe has a successful transport ACK.
    alarm_sink:
      configured: false
      type: hermes_cron
      target: "telegram:REPLACE_WITH_VALIDATED_OPERATOR_CHAT_ID"
      # BlueBubbles alarms use Poke's outbound-only config. Guest remains a
      # policy/memory owner, never a BlueBubbles ingress owner.
      delivery_profile: poke
      probe_max_age_seconds: 25200
    allowed_contacts:
      - {profile: poke, contact_id: kosta-owner, principal: owner}
      - {profile: guest, contact_id: stephen-lucier, principal: guest}
    active_hours: {start: "09:00", end: "21:30"}
    weekly_interest_cap: 2
    weekly_total_cap: 3
    min_gap_hours: 48
    eligibility_min_messages_14d: 5
    backoff_after_dismissals: 3
    backoff_days: 30
    max_retry_attempts: 3
    retry_base_seconds: 300
    circuit_breaker_failures: 3
    circuit_breaker_cooldown_seconds: 21600
    compose_model:
      provider: openai-codex
      model: gpt-5.6-sol
      reasoning_effort: low
      fallback: false
    gate_task: proactive_gate
auxiliary:
  proactive_semantic:
    provider: openai-codex
    model: gpt-5.6-sol
    reasoning_effort: medium
    fallback: false
  proactive_gate:
    provider: openai-codex
    model: gpt-5.6-sol
    reasoning_effort: medium
    fallback: false
